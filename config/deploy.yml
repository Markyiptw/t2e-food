service: example
image: example/example

servers:
  web:
    - www.example.com

proxy:
  ssl: true
  host: www.example.com
  # default is 80
  # but our image listens to 8080
  app_port: 8080

registry:
  server: localhost:5555

env:
  clear:
    DB_CONNECTION: pgsql
    # hostname inside docker = ${service}-${accessory}
    DB_HOST: example-db
    DB_USERNAME: postgres
    DB_DATABASE: postgres
    AUTORUN_ENABLED: true
  secret:
    - APP_KEY
    - DB_PASSWORD

ssh:
  user: example-user

volumes:
  - "app_storage:/var/www/html/storage/app"

asset_path: /var/www/html/public/build/assets

accessories:
  db:
    image: postgres:17
    host: www.example.com
    # port: 5432 # this option is for public exposure, not needed when communicating inside docker network
    env:
      clear:
        PGDATA: "/var/lib/postgresql/17/docker"
      secret:
        - POSTGRES_PASSWORD:DB_PASSWORD
    directories:
      # kamal create a unique directory for each accessory
      # so no need to worry about name collision
      - data:/var/lib/postgresql
